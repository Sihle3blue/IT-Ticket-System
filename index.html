<style>

:root[data-theme="light"]{--bg:#eceef7;--panel:#fff;--ink:#1c2049;--muted:#5b6190;--line:#d3d6ea;--accent:#c2571a;--ok:#2b8a57;--warn:#c98a12;--red:#e5262b;--redbg:#fff1f1;--page:#eceef7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:var(--page);background-attachment:fixed;color:var(--ink);font:16px/1.45 "Space Grotesk",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;background:#f1f2f8;color:#1c2049;border-bottom:3px solid #9b2335}

h1{font-size:26px;font-weight:700}h2{font-size:20px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea{resize:vertical;min-height:60px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;font-weight:600}

main{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px;max-width:1500px;margin:0 auto}

aside,.sec{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}.who select{width:auto}
#alert{display:none;margin-bottom:14px;padding:12px 16px;border-radius:8px;background:var(--red);color:#fff;font-weight:600}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

.t{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:8px;padding:14px}
.t.soon{border-left-color:var(--warn)}

@keyframes glow{from{box-shadow:0 0 4px 0 var(--red)}to{box-shadow:0 0 22px 5px var(--red)}}

.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top h3{margin:0;font-size:17px}
.id{color:var(--muted);font-size:13px}
.desc{margin:6px 0;color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-top:8px}
.tag{padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.tag.High{border-color:var(--red);color:var(--red)}
.clock{font:700 26px "Space Mono",ui-monospace,monospace;white-space:nowrap}
.over .clock{color:var(--red)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}

.acts{display:flex;gap:8px;margin-top:10px}

header h1{color:#9b2335}header .who{color:#5b6190}header select,header button{background:#fff;color:#1c2049;border-color:#d3d6ea}

.scroll{overflow-x:auto}.tl{min-width:960px;position:relative}

.rows{position:relative}.r{display:grid;grid-template-columns:130px 1fr;border-top:1px solid var(--line)}

.ra{position:relative;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/19 - 1px),var(--line) calc(100%/19 - 1px),var(--line) calc(100%/19))}

.bn{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bm{font:11px "Space Mono",ui-monospace,monospace;opacity:.85;white-space:nowrap}

.b.sched{background:#6b73b0;color:#fff}.b.prog{background:#3f9c6b;color:#fff}.b.d90{background:#c9a24a;color:#1c2049}.b.d45{background:#d0707f;color:#1c2049}.b.over{background:#9b1c2e;color:#fff}.b.done{background:#8b90a8;color:#fff;opacity:.6}

.nl{position:absolute;top:0;bottom:0;width:2px;background:#f0a35c;pointer-events:none;z-index:2}
#tkDlg{width:min(560px,calc(100% - 32px))}

.trow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.trow span:first-child{flex:1;font-weight:600}
.trow button{padding:3px 10px;font-size:13px}
#techs{display:block;margin-top:6px}
#techHits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.hit{padding:5px 12px;font-size:14px}
.b.prog{background:#2f7fc4;color:#fff}.b.done{background:#2e9e5b;color:#fff;opacity:1}
.t.done{opacity:.85;border-left-color:var(--ok)}
.sr{position:absolute;left:-9999px}
#logo svg{height:44px;width:auto;display:block}
#splash{position:fixed;inset:0;z-index:9999;background:#f1f2f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.sl{position:relative;width:min(340px,72vw)}
.sl svg{width:100%;height:auto;display:block}
#sl1{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--p,0%)) 0 0)}
#spMsg{font:14px "Space Mono",ui-monospace,monospace;color:#5b6190}
.lcard{max-width:400px;margin:8vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:calc(100% - 32px)}

.trow{flex-wrap:wrap}
#whoName{font-size:14px;color:#5b6190;font-weight:600}
.mt{border-top:1px solid var(--line);padding:10px 12px}
.mh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.mh small{color:var(--accent);font-weight:600;margin-left:6px}.mh span{font:12px "Space Mono",ui-monospace,monospace;color:var(--muted)}
.mh.me{box-shadow:inset 4px 0 0 var(--accent);padding-left:8px}
.mc{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid rgba(0,0,0,.2);border-radius:6px;padding:10px 12px;margin-bottom:6px;font:inherit}
.mc b{font-size:14px}.mc span{font:12px "Space Mono",ui-monospace,monospace;white-space:nowrap}
.mc.over{animation:glow 1.2s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){.mc.over{animation:none;box-shadow:0 0 10px 2px var(--red)}}
</style>

<script>
(function(){
var MANAGERS=["Owner","Operations Manager","IT Manager"];
var state={accounts:[],techs:[],tickets:[]};
var role="",filter="All";
var $=function(i){return document.getElementById(i)};
function save(){try{localStorage.setItem("itboard",JSON.stringify(state))}catch(e){}}
var mode="db",sb=null,ready=false,me=null,pendingUser=null,lgMode="in",ch=null,rt=null,liveMsg="",lockMsg="This site is not connected to a database yet. Add your Supabase details at the top of index.html (see the README).",syncT;
function isMgr(){return !!me&&MANAGERS.indexOf(me.role)>-1}
function isAdmin(){return !!me&&(me.role==="Owner"||me.role==="IT Manager")}
function setMe(a){me=a;role=a?(MANAGERS.indexOf(a.role)>-1?a.role:a.name):"";filter=isMgr()?"All":role}
function syncTechs(){state.techs=state.accounts.filter(function(a){return a.role==="Technician"}).map(function(a){return a.name})}
function setSync(m,bad){var e=$("sync");e.textContent=m;e.style.color=bad?"var(--red)":"var(--muted)";clearTimeout(syncT);if(liveMsg&&m!==liveMsg)syncT=setTimeout(function(){setSync(liveMsg)},6000)}
function bad(e){setSync("Could not save"+(e&&e.message?": "+e.message:"")+".",true)}
function nameOf(id){var p=state.accounts.find(function(x){return x.id===id});return p?p.name:"(removed)"}
function profByName(n){return state.accounts.find(function(x){return x.role==="Technician"&&x.name===n})}
function fromRow(r){return{id:r.id,title:r.title,desc:r.description||"",pri:r.priority,assignee:nameOf(r.assignee),by:r.created_by_role,created:Number(r.created_ms),due:Number(r.due_ms),status:r.status,startedAt:r.started_ms?Number(r.started_ms):null,doneAt:r.done_ms?Number(r.done_ms):null,ext:r.ext_ms?{ms:Number(r.ext_ms),reason:r.ext_reason||""}:null,extNote:r.ext_note||null}}
function persist(t){var p={status:t.status,started_ms:t.startedAt||null,done_ms:t.doneAt||null,due_ms:Math.round(t.due),ext_ms:t.ext?Math.round(t.ext.ms):null,ext_reason:t.ext?t.ext.reason:null,ext_note:t.extNote||null};
 sb.from("tickets").update(p).eq("id",t.id).then(function(r){if(r.error){bad(r.error);reload()}})}
function persistDel(id){sb.from("tickets").delete().eq("id",id).then(function(r){if(r.error){bad(r.error);reload()}})}
async function loadAll(){
 var s=await sb.auth.getSession(),u=s.data&&s.data.session&&s.data.session.user;
 if(!u){me=null;pendingUser=null;return}
 var pr=await sb.from("profiles").select("*");if(pr.error)throw pr.error;
 state.accounts=pr.data||[];syncTechs();
 var mine=state.accounts.find(function(p){return p.id===u.id});
 if(!mine||mine.role==="Pending"){me=null;pendingUser=mine||{email:u.email};state.tickets=[];return}
 pendingUser=null;
 if(!me){setMe(mine);view=isMgr()?"new":"board"}else{me=mine;role=MANAGERS.indexOf(mine.role)>-1?mine.role:mine.name}
 var tk=await sb.from("tickets").select("*").order("id");if(tk.error)throw tk.error;
 state.tickets=(tk.data||[]).map(fromRow)}
async function reload(){try{await loadAll();if(me)fillSelects();render()}catch(e){}}
function startRealtime(){if(ch||!sb)return;function kick(){clearTimeout(rt);rt=setTimeout(reload,300)}
 ch=sb.channel("app").on("postgres_changes",{event:"*",schema:"public",table:"tickets"},kick).on("postgres_changes",{event:"*",schema:"public",table:"profiles"},kick).subscribe()}
async function signOut(msg){try{if(sb)await sb.auth.signOut()}catch(e){}
 if(ch&&sb){sb.removeChannel(ch);ch=null}
 me=null;pendingUser=null;role="";filter="All";closeTk();state.tickets=[];lgMode="in";$("lgErr").textContent=typeof msg==="string"?msg:"";$("lgPass").value="";render()}
function showLogin(){var lp=$("loginPage");lp.style.display="";
 var lk=mode==="locked",pend=!!pendingUser&&lgMode!=="reset",f=!lk&&!pend,t,n;
 if(lk){t="Not available";n=lockMsg}
 else if(pend){t="Waiting for access";n="Your account ("+(pendingUser.email||"")+") is created. The owner needs to give you a role before you can use the board."}
 else if(lgMode==="reset"){t="Choose a new password";n=""}
 else if(lgMode==="up"){t="Create your account";n="After you sign up, the owner gives you a role. The very first account becomes the Owner."}
 else{t="Sign in";n="Sign in with your email and password."}

$("lgPass").onkeydown=function(e){if(e.key==="Enter")doLogin()};
$("lgSwap").onclick=function(){lgMode=lgMode==="up"?"in":"up";$("lgErr").textContent="";showLogin()};
$("lgForgot").onclick=async function(){var em=$("lgEmail").value.trim(),err=$("lgErr");err.style.color="";
 if(!em){err.textContent="Type your email above first.";return}
 var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
 if(r.error){err.textContent=r.error.message}else{err.style.color="var(--muted)";err.textContent="If that email has an account, a reset link is on its way."}};
$("lgOut").onclick=function(){signOut()};$("logout").onclick=function(){signOut()};
function finish(){if(ready)return;ready=true;setProgress(1,"Opening…");syncTechs();fillSelects();render()}
(async function(){
 if(!window.supabase){lockMsg="Could not load the database library. Check your internet connection and reload.";mode="locked";finish();return}
 var url=(CFG.url||"").trim().replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,""),key=(CFG.key||"").trim(),why="";
 if(url.indexOf("PASTE_")===0||key.indexOf("PASTE_")===0)why="The Supabase URL and key have not been added to index.html yet. Edit index.html on GitHub, paste both between the quotes, save (commit), wait a minute, then reload.";
 else if(!/^https:\/\/[^\s]+$/.test(url))why="The Supabase URL in index.html does not look right. It should start with https:// and look like https://abcdefgh.supabase.co";
 else if(key.length<20)why="The Supabase key in index.html looks too short. Copy the whole Publishable key.";
 if(why){lockMsg=why;mode="locked";finish();return}
 try{
  sb=supabase.createClient(url,key);
  sb.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){lgMode="reset";render()}});
  setProgress(.4,"Checking your sign-in…");
  await loadAll();setProgress(.8,"Loading tickets…");
  if(me||pendingUser)startRealtime();
  liveMsg="Live: everyone signed in sees the same board.";setSync(liveMsg);
  finish()
 }catch(e){lockMsg="Could not reach the database. Check the Supabase URL and key at the top of index.html, then reload.";mode="locked";finish()}
})();
})();
</script>
</body>
</html>
